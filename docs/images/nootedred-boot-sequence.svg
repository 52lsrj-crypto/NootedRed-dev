<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5b6573"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
  </marker>
  <style>
    text { font-family: Noto Sans CJK SC, Microsoft YaHei, Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 26px; font-weight: 700; }
    .sub { font-size: 13px; fill: #5b6573; }
    .boxTitle { font-size: 15px; font-weight: 700; }
    .boxText { font-size: 12px; fill: #374151; }
    .label { font-size: 12px; fill: #5b6573; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="42" class="title">启动时序（简化）</text>
<text x="40" y="64" class="sub">从 OpenCore 到 WindowServer 的关键阶段</text>
<rect x="40" y="130" width="200" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="130" width="6" height="120" rx="3" fill="#2563eb"/><text x="58" y="156" class="boxTitle">1. Boot</text><text x="58" y="178" class="boxText">OpenCore 加载 Lilu</text><text x="58" y="196" class="boxText">再加载 NootedRed</text><rect x="270" y="130" width="200" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="270" y="130" width="6" height="120" rx="3" fill="#2563eb"/><text x="288" y="156" class="boxTitle">2. Lilu init</text><text x="288" y="178" class="boxText">PE_initialize_console</text><text x="288" y="196" class="boxText">KernelPatcher.init</text><text x="288" y="214" class="boxText">finaliseRequests</text><rect x="500" y="130" width="200" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="500" y="130" width="6" height="120" rx="3" fill="#2563eb"/><text x="518" y="156" class="boxTitle">3. NRed init</text><text x="518" y="178" class="boxText">PluginConfiguration</text><text x="518" y="196" class="boxText">onKextLoadForce ×5</text><text x="518" y="214" class="boxText">onPatcherLoadForce</text><rect x="730" y="130" width="200" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="730" y="130" width="6" height="120" rx="3" fill="#2563eb"/><text x="748" y="156" class="boxTitle">4. 内核补丁</text><text x="748" y="178" class="boxText">processPatcher</text><text x="748" y="196" class="boxText">DriverInjector / RuntimeMC</text><text x="748" y="214" class="boxText">X6000FB / X5000 / HWLibs</text><rect x="960" y="130" width="200" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="960" y="130" width="6" height="120" rx="3" fill="#2563eb"/><text x="978" y="156" class="boxTitle">5. 用户态</text><text x="978" y="178" class="boxText">WindowServer / 应用</text><text x="978" y="196" class="boxText">_shared_region_check_np</text><text x="978" y="214" class="boxText">_cs_validate_page</text><line x1="240" y1="190" x2="270" y2="190" stroke="#5b6573" stroke-width="2" marker-end="url(#arrow)"/><line x1="470" y1="190" x2="500" y2="190" stroke="#5b6573" stroke-width="2" marker-end="url(#arrow)"/><line x1="700" y1="190" x2="730" y2="190" stroke="#5b6573" stroke-width="2" marker-end="url(#arrow)"/><line x1="930" y1="190" x2="960" y2="190" stroke="#5b6573" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="310" width="360" height="140" rx="10" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5"/><rect x="40" y="310" width="6" height="140" rx="3" fill="#2563eb"/><text x="58" y="336" class="boxTitle">关键顺序</text><text x="58" y="358" class="boxText">1. Lilu 先于 NootedRed</text><text x="58" y="376" class="boxText">2. patcher 回调早于 UserPatcher</text><text x="58" y="394" class="boxText">3. kext 补丁在 Apple kext 加载时</text><text x="58" y="412" class="boxText">4. VPF 最后，在进程调用时</text><rect x="430" y="310" width="360" height="140" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><rect x="430" y="310" width="6" height="140" rx="3" fill="#dc2626"/><text x="448" y="336" class="boxTitle">失败会出现在哪里</text><text x="448" y="358" class="boxText">插件加载/路由冲突 → panic</text><text x="448" y="376" class="boxText">引擎分配失败 → 启动卡死</text><text x="448" y="394" class="boxText">compute Hook 挂死 → watchdog</text><text x="448" y="412" class="boxText">VFV/VPF 拒绝 → 功能降级</text><rect x="820" y="310" width="340" height="140" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><rect x="820" y="310" width="6" height="140" rx="3" fill="#16a34a"/><text x="838" y="336" class="boxTitle">证据</text><text x="838" y="358" class="boxText">kext UUID</text><text x="838" y="376" class="boxText">NRedKernel* / NRed*RouteConflict</text><text x="838" y="394" class="boxText">panic / gpuRestart / kernel log</text><rect x="40" y="500" width="1120" height="70" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><rect x="40" y="500" width="6" height="70" rx="3" fill="#d97706"/><text x="58" y="526" class="boxTitle">判断原则</text><text x="58" y="548" class="boxText">CI 编译通过 ≠ 实机可用；每个阶段都必须有 ioreg/日志证据，不能跨启动会话混合</text></svg>
