<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="42" class="title">崩溃链与判定</text>
<text x="40" y="64" class="sub">三条主要路径：路由冲突、computeUQ2/GFXOFF、启动卡死</text>
<rect x="40" y="100" width="300" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><rect x="40" y="100" width="6" height="60" rx="3" fill="#dc2626"/><text x="58" y="126" class="boxTitle">A. 路由冲突</text><text x="58" y="148" class="boxText">Lilu: previous plugin had short jump</text><rect x="40" y="190" width="300" height="90" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><rect x="40" y="190" width="6" height="90" rx="3" fill="#2563eb"/><text x="58" y="216" class="boxTitle">触发点</text><text x="58" y="238" class="boxText">AppleGFXHDA probe / factory / widget</text><text x="58" y="256" class="boxText">已被其他插件用 Short 路由</text><rect x="40" y="320" width="300" height="90" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><rect x="40" y="320" width="6" height="90" rx="3" fill="#16a34a"/><text x="58" y="346" class="boxTitle">修复</text><text x="58" y="368" class="boxText">isShortRouted 预检</text><text x="58" y="386" class="boxText">冲突则跳过 + NRedAppleGFXHDARouteConflict=1</text><line x1="190" y1="160" x2="190" y2="190" stroke="#b42318" stroke-width="2" marker-end="url(#arrowRed)"/><line x1="190" y1="280" x2="190" y2="320" stroke="#b42318" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="430" y="100" width="340" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><rect x="430" y="100" width="6" height="60" rx="3" fill="#dc2626"/><text x="448" y="126" class="boxTitle">B. computeUQ2 / GFXOFF</text><text x="448" y="148" class="boxText">GPU restart + WindowServer watchdog</text><rect x="430" y="190" width="340" height="100" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><rect x="430" y="190" width="6" height="100" rx="3" fill="#2563eb"/><text x="448" y="216" class="boxTitle">代码路径</text><text x="448" y="238" class="boxText">computeSubmitCommandBuffer</text><text x="448" y="256" class="boxText">notifyGfxAccess(HWInterface*)</text><text x="448" y="274" class="boxText">GFXOFF 未正确退出</text><rect x="430" y="320" width="340" height="100" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><rect x="430" y="320" width="6" height="100" rx="3" fill="#2563eb"/><text x="448" y="346" class="boxTitle">结果</text><text x="448" y="368" class="boxText">computeUQ2 不排空</text><text x="448" y="386" class="boxText">VTMTSComputeFunction 等待</text><text x="448" y="404" class="boxText">CPCompute=BUSY</text><rect x="430" y="450" width="340" height="90" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><rect x="430" y="450" width="6" height="90" rx="3" fill="#d97706"/><text x="448" y="476" class="boxTitle">缓解</text><text x="448" y="498" class="boxText">Renoir 默认关闭 Hook</text><text x="448" y="516" class="boxText">-NRedComputeSubmit 对照</text><text x="448" y="534" class="boxText">根因：传参类型仍未修</text><line x1="600" y1="160" x2="600" y2="190" stroke="#b42318" stroke-width="2" marker-end="url(#arrowRed)"/><line x1="600" y1="290" x2="600" y2="320" stroke="#b42318" stroke-width="2" marker-end="url(#arrowRed)"/><line x1="600" y1="420" x2="600" y2="450" stroke="#b42318" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="840" y="100" width="320" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><rect x="840" y="100" width="6" height="60" rx="3" fill="#dc2626"/><text x="858" y="126" class="boxTitle">C. 启动卡死 / IOKitWaitQuiet</text><text x="858" y="148" class="boxText">无 panic，WindowServer 等设备</text><rect x="840" y="190" width="320" height="110" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><rect x="840" y="190" width="6" height="110" rx="3" fill="#2563eb"/><text x="858" y="216" class="boxTitle">候选 1</text><text x="858" y="238" class="boxText">allocateHWEngines 失败 → false</text><text x="858" y="256" class="boxText">原生 init 中止</text><text x="858" y="274" class="boxText">WindowServer 120s watchdog</text><rect x="840" y="320" width="320" height="110" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><rect x="840" y="320" width="6" height="110" rx="3" fill="#2563eb"/><text x="858" y="346" class="boxTitle">候选 2</text><text x="858" y="368" class="boxText">RuntimeMC 冲突跳过</text><text x="858" y="386" class="boxText">mcVft 未初始化 + registerMC</text><text x="858" y="404" class="boxText">DCN 半初始化</text><rect x="840" y="450" width="320" height="110" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><rect x="840" y="450" width="6" height="110" rx="3" fill="#2563eb"/><text x="858" y="476" class="boxTitle">候选 3</text><text x="858" y="498" class="boxText">DriverInjector 冲突</text><text x="858" y="516" class="boxText">personalities 未注入</text><text x="858" y="534" class="boxText">黑屏 / 无加速</text><line x1="1000" y1="160" x2="1000" y2="190" stroke="#b42318" stroke-width="2" marker-end="url(#arrowRed)"/><line x1="1000" y1="300" x2="1000" y2="320" stroke="#b42318" stroke-width="2" marker-end="url(#arrowRed)"/><line x1="1000" y1="430" x2="1000" y2="450" stroke="#b42318" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="40" y="620" width="1120" height="150" rx="10" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5"/><rect x="40" y="620" width="6" height="150" rx="3" fill="#2563eb"/><text x="58" y="646" class="boxTitle">ioreg 判定</text><text x="58" y="668" class="boxText">NRedKernelComputeHook=0/1/2 · NRedKernelComputeVTable</text><text x="58" y="686" class="boxText">NRedRuntimeMCRouteConflict / NRedDriverInjectorRouteConflict / NRedAppleGFXHDARouteConflict</text><text x="58" y="704" class="boxText">NRedHWEngineAllocFailed=1/2 · NRedChannelTypesPatternMismatch · NRedHwLateInitReadFailed</text><text x="58" y="722" class="boxText">NRedX5000RouteFailed · NRedHwMaxCUs · NRedKernelFlipWaitMax</text></svg>
